skill: openscreen
version: "0.1.0"
description: Record and export OpenScreen projects through its typed headless CLI.
tools:
  - name: sources
    description: List available displays, windows, and microphones.
    source_file: scripts/sources.py
    input_schema: {type: object, additionalProperties: false}
    execution: sync
    affinity: any
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false}
  - name: record
    description: Record a bounded display or window capture to an optional OpenScreen project.
    source_file: scripts/record.py
    input_schema:
      type: object
      additionalProperties: false
      properties:
        duration: {type: integer, minimum: 1, maximum: 3600, default: 30}
        window: {type: string, minLength: 1, maxLength: 256}
        display: {type: integer, minimum: 0, maximum: 32, default: 0}
        project: {type: string, maxLength: 4096}
        mic: {type: boolean, default: false}
        system_audio: {type: boolean, default: false}
    execution: sync
    affinity: any
    timeout_hint_secs: 3720
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false}
  - name: export
    description: Render an OpenScreen project to MP4 or GIF.
    source_file: scripts/export.py
    input_schema:
      type: object
      required: [project]
      additionalProperties: false
      properties:
        project: {type: string, minLength: 1, maxLength: 4096}
        output: {type: string, maxLength: 4096}
        quality: {enum: [medium, good, source], default: source}
    execution: sync
    affinity: any
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: true, open_world_hint: false}
  - name: info
    description: Inspect a project and verify referenced media.
    source_file: scripts/info.py
    input_schema: {type: object, required: [project], additionalProperties: false, properties: {project: {type: string, minLength: 1, maxLength: 4096}}}
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false}
  - name: pack
    description: Pack a project and referenced media into a portable folder.
    source_file: scripts/pack.py
    input_schema: {type: object, required: [project, output], additionalProperties: false, properties: {project: {type: string, minLength: 1, maxLength: 4096}, output: {type: string, minLength: 1, maxLength: 4096}}}
    execution: sync
    affinity: any
    timeout_hint_secs: 600
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: true, open_world_hint: false}
  - name: captions
    description: Generate local Whisper captions for a project with bounded word grouping.
    source_file: scripts/captions.py
    input_schema: {type: object, required: [project], additionalProperties: false, properties: {project: {type: string, minLength: 1, maxLength: 4096}, min_words: {type: integer, minimum: 1, maximum: 20, default: 2}, max_words: {type: integer, minimum: 1, maximum: 20, default: 7}}}
    execution: sync
    affinity: any
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: true, open_world_hint: false}
